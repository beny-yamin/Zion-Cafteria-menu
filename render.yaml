services:
  # Backend API & Socket.io Web Service
  - type: web
    name: cafeteria-digital-menu-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: jaaamin-rox

  # Frontend React 18 / Vite Static Site
  - type: web
    name: cafeteria-digital-menu-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDCB4EuBUxBRGss6m43bvuJX1PlaZB7jlU
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: jaaamin-rox.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: jaaamin-rox
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: jaaamin-rox.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "858861626056"
      - key: VITE_FIREBASE_APP_ID
        value: "1:858861626056:web:934eb11b87c1dd85ca3bfd"
